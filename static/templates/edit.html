<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar Nota - Get-it</title>
  <link rel="stylesheet" href="{{{{ url_for('static', filename='css/getit.css') }}}}">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="appbar">
    <img class="logo" src="{{{{ url_for('static', filename='img/logo-getit.png') }}}}" alt="Get-it Logo">
    <p class="subtitle">Como o Post-it, mas com outro verbo</p>
  </div>

  <div class="form-card">
    <h2 class="form-card-title">Editar nota</h2>
    <form action="/update" method="POST">
      <input type="hidden" name="id" value="{note_id}" />
      
      <label for="titulo">Título</label>
      <input id="titulo" type="text" name="titulo" value="{titulo}" />
      
      <label for="detalhes">Detalhes</label>
      <textarea id="detalhes" name="detalhes">{detalhes}</textarea>
      
      <div class="button-group">
        <input type="submit" value="Salvar" />
        <a href="/" class="cancel-button">Cancelar</a>
      </div>
    </form>
  </div>

  <script src="{{{{ url_for('static', filename='js/getit.js') }}}}"></script>
</body>
</html>
